name: Release & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Keyed by ref so pull requests check in parallel while main stays serialized.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  release:
    needs: quality
    # Pull requests stop after `quality`; only main releases and deploys.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${{ needs.release.outputs.version }}"
          minor="${v%.*}"
          major="${v%%.*}"
          echo "image=${name}:${v}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "${name}:${v}"
            echo "${name}:${minor}"
            echo "${name}:${major}"
            echo "${name}:latest"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release, build-and-push]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install cloudflared
        run: |
          cloudflared_path="${RUNNER_TEMP}/cloudflared"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 120 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64 \
            -o "$cloudflared_path"
          echo "053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0  $cloudflared_path" | sha256sum --check
          chmod 700 "$cloudflared_path"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$cloudflared_path" --version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy compose file to server
        run: |
          ssh deploy-target 'mkdir -p ~/juji-discord-bot'
          IMAGE="${IMAGE}" envsubst '${IMAGE}' < docker-compose.prod.yml \
            | ssh deploy-target 'cat > ~/juji-discord-bot/docker-compose.yml'
          # Lavalink mounts this; ship it alongside the compose file.
          ssh deploy-target 'cat > ~/juji-discord-bot/application.yml' < application.yml

      - name: Write server .env from GitHub secrets
        run: |
          ssh deploy-target 'umask 077; cat > ~/juji-discord-bot/.env' <<EOF
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
          BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          API_PORT=${{ secrets.API_PORT }}
          API_CORS_ORIGINS=${{ secrets.API_CORS_ORIGINS }}
          LAVALINK_PASSWORD=${{ secrets.LAVALINK_PASSWORD }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Deploy
        run: |
          ssh deploy-target bash -s <<EOF
          set -euo pipefail
          cd ~/juji-discord-bot
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull
          docker compose up -d
          docker image prune -f
          docker logout ghcr.io
          EOF

  notify:
    needs: [release, build-and-push, deploy]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Discord release notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.release.outputs.version }}
          NOTES: ${{ needs.release.outputs.notes }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          truncated_notes=$(echo "$NOTES" | head -c 1000)
          payload=$(jq -n \
            --arg title "Juji v${VERSION} deployed" \
            --arg url "https://github.com/${REPO}/releases/tag/v${VERSION}" \
            --arg notes "$truncated_notes" \
            --arg image "$IMAGE" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg version "v${VERSION}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: 5763719,
                description: $notes,
                fields: [
                  { name: "Image", value: ("`" + $image + "`"), inline: false },
                  { name: "Deployed by", value: ("[" + $actor + "](https://github.com/" + $actor + ")"), inline: true },
                  { name: "Release", value: ("[" + $version + "](https://github.com/" + $repo + "/releases/tag/" + $version + ")"), inline: true }
                ],
                footer: { text: "semantic-release" },
                timestamp: (now | todate)
              }]
            }')
          curl -fsSL -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
