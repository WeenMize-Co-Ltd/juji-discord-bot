server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Pinned to a master snapshot: YouTube began rejecting the Cobalt UA on the TVHTML5
    # player endpoint (~2026-08-18), returning "The page needs to be reloaded", and made
    # the ANDROID/IOS client versions return HTTP 400. Those are fixed on master (#233,
    # #231) but not yet in a tagged release (1.18.2 is the latest). Revert to a release
    # tag once 1.19.0 ships.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3'
      snapshot: true
  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # No OAuth: Google disables burner accounts used for the device flow, so playback
    # relies on the unauthenticated clients. ANDROID_VR/ANDROID_MUSIC/IOS/MWEB hand out
    # pre-signed URLs (bypassing the signature-cipher path), MUSIC handles searches only,
    # and WEB/WEBEMBEDDED are the fallback. TV is omitted: its playback always requires
    # sign-in, so without OAuth it can only fail. If YouTube starts demanding a login
    # again, add a poToken for WEB/WEBEMBEDDED instead (see README).
    clients:
      - ANDROID_VR
      - ANDROID_MUSIC
      - IOS
      - MWEB
      - MUSIC
      - WEB
      - WEBEMBEDDED
    # Delegates signature/player-script parsing to a remote cipher server, avoiding
    # "Must find sig function from script" breakage when YouTube rotates its player.
    remoteCipher:
      url: 'https://cipher.kikkia.dev/'
      userAgent: 'juji-discord-bot'

logging:
  level:
    root: INFO
    lavalink: INFO
