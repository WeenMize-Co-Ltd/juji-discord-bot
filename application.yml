server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Pinned to a master snapshot: YouTube began rejecting the Cobalt UA on the TVHTML5
    # player endpoint (~2026-08-18), returning "The page needs to be reloaded", and made
    # the ANDROID/IOS client versions return HTTP 400. Those are fixed on master (#233,
    # #231) but not yet in a tagged release (1.18.2 is the latest). Revert to a release
    # tag once 1.19.0 ships.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3'
      snapshot: true
  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV is the only OAuth-capable client — put it first so authenticated playback is
    # attempted before the unauthenticated clients (MUSIC has no playback, so it's used
    # for search only and is skipped for playback). Some videos still fail on TV/WEB, so
    # also register the clients that hand out pre-signed URLs (ANDROID_MUSIC, IOS, MWEB),
    # which bypass the signature-cipher path entirely.
    clients:
      - TV
      - ANDROID_VR
      - ANDROID_MUSIC
      - IOS
      - MWEB
      - MUSIC
      - WEB
      - WEBEMBEDDED
    # On a datacenter/VPS IP, YouTube demands a logged-in session ("This video requires
    # login"). OAuth with a BURNER Google account is the fix; a poToken alone is not
    # enough. Set YOUTUBE_OAUTH_REFRESH_TOKEN in .env after completing the device login
    # (see README). When the token is absent, the OAuth flow is triggered on boot and the
    # refresh token is printed to the logs.
    oauth:
      enabled: true
      refreshToken: '${YOUTUBE_OAUTH_REFRESH_TOKEN:}'
    # Delegates signature/player-script parsing to a remote cipher server, avoiding
    # "Must find sig function from script" breakage when YouTube rotates its player.
    remoteCipher:
      url: 'https://cipher.kikkia.dev/'
      userAgent: 'juji-discord-bot'

# Surfaces the OAuth device-login code and the resulting refresh token in the logs.
logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
